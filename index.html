<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatRoll — Кейсы и NFT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #1a1d24;
            --accent-color: #7000ff;
            --accent-hover: #5e00d9;
            --text-color: #ffffff;
            --text-secondary: #8b92a5;
            --gold: #ffd700;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid #2a2e39;
        }
        .balance-box {
            font-size: 16px;
            font-weight: bold;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        .tab-content {
            display: none;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .tab-content.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn {
            background-color: var(--accent-color);
            color: var(--text-color);
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 15px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(112, 0, 255, 0.3);
        }
        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }
        .btn:disabled {
            background-color: #3a3f4e;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        nav {
            display: flex;
            background-color: var(--card-bg);
            border-top: 1px solid #2a2e39;
        }
        nav button {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 15px;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
        }
        nav button.active {
            color: var(--accent-color);
            font-weight: bold;
        }
        .case-roulette-container {
            width: 100%;
            height: 140px;
            background: var(--card-bg);
            border: 2px solid #2a2e39;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            margin: 20px 0;
            display: flex;
            align-items: center;
        }
        .case-selector-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #ff4757;
            z-index: 10;
            transform: translateX(-50%);
            box-shadow: 0 0 10px #ff4757;
        }
        .case-items-track {
            display: flex;
            position: absolute;
            left: 0;
            will-change: transform;
        }
        .case-item-box {
            min-width: 110px;
            height: 110px;
            background: #222632;
            border: 1px solid #323846;
            border-radius: 12px;
            margin: 0 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 10px;
            overflow: hidden;
        }
        .case-item-box img, .case-item-box video {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-bottom: 5px;
            border-radius: 6px;
        }
        .case-item-box .item-name {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90px;
        }
        .item-card {
            background: var(--card-bg);
            border: 1px solid #2a2e39;
            border-radius: 14px;
            padding: 15px;
            margin: 10px 0;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin: 10px 0;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 12px;
            box-sizing: border-box;
            border: 1px solid #2a2e39;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #3a3f4e; transition: .3s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent-color); }
        input:checked + .slider:before { transform: translateX(24px); }
    </style>
</head>
<body>

    <header>
        <div class="balance-box">⭐ <span id="user-balance">0</span></div>
    </header>

    <div class="content">
        <!-- Вкладка кейсов -->
        <div id="tab-cases" class="tab-content active">
            <h2>Открытие кейсов</h2>
            <p style="color: var(--text-secondary);">Испытай удачу в рулетке подарков</p>
            
            <div class="settings-row">
                <span>Демо-режим</span>
                <label class="switch">
                    <input type="checkbox" id="demo-mode-checkbox">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="case-roulette-container">
                <div class="case-selector-line"></div>
                <div class="case-items-track" id="case-track"></div>
            </div>

            <button class="btn" id="spin-case-btn" onclick="spinCase()">Крутить кейс (-100 ⭐)</button>
        </div>

        <!-- Вкладка колеса -->
        <div id="tab-wheel" class="tab-content">
            <h2>Колесо фортуны</h2>
            <p style="color: var(--text-secondary);">Крути колесо и забирай ценные призы</p>
            
            <div class="case-roulette-container">
                <div class="case-selector-line"></div>
                <div class="case-items-track" id="wheel-track"></div>
            </div>

            <button class="btn" id="spin-wheel-btn" onclick="spinWheel()">Крутить колесо (-50 ⭐)</button>
        </div>

        <!-- Вкладка инвентаря -->
        <div id="tab-inventory" class="tab-content">
            <h2>Инвентарь</h2>
            <div id="inventory-list" style="width: 100%; max-height: 380px; overflow-y: auto;">
                <p style="color: var(--text-secondary);">Ваш инвентарь пуст</p>
            </div>
        </div>
    </div>

    <nav>
        <button class="active" onclick="switchTab('cases', this)">Кейсы</button>
        <button onclick="switchTab('wheel', this)">Колесо</button>
        <button onclick="switchTab('inventory', this)">Инвентарь</button>
    </nav>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        const userId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "test_user_123";
        
        let localItemsPool = [
            {"id": 1, "name": "Star Pouch", "icon": "⭐", "image": "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f31f.png", "animation": "", "price": 30},
            {"id": 2, "name": "Animated Gift Box", "icon": "🎁", "image": "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f381.png", "animation": "https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-and-numbers-31958-large.mp4", "price": 150},
            {"id": 3, "name": "Rubber Duck", "icon": "🦆", "image": "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f986.png", "animation": "", "price": 120},
            {"id": 4, "name": "Cyber Neon", "icon": "🚀", "image": "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f680.png", "animation": "https://assets.mixkit.co/videos/preview/mixkit-looped-animation-of-a-futuristic-tunnel-41566-large.mp4", "price": 500},
            {"id": 5, "name": "Telegram Gem", "icon": "💎", "image": "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f48e.png", "animation": "", "price": 250},
            {"id": 6, "name": "Golden Crown", "icon": "👑", "image": "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f451.png", "animation": "", "price": 800}
        ];

        async function initApp() {
            try {
                const response = await fetch('/api/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await response.json();
                document.getElementById('user-balance').innerText = data.balance;
                updateInventoryUI(data.inventory || []);
                buildRouletteTracks();
            } catch (e) {
                console.error("Init error:", e);
                buildRouletteTracks();
            }
        }

        function renderMedia(item) {
            if (item.animation && (item.animation.endsWith('.mp4') || item.animation.includes('mixkit.co'))) {
                return `<video src="${item.animation}" autoplay loop muted playsinline></video>`;
            }
            return `<img src="${item.image || ''}" alt="${item.name}" onerror="this.style.display='none'">`;
        }

        function buildRouletteTracks() {
            ['case-track', 'wheel-track'].forEach(trackId => {
                const track = document.getElementById(trackId);
                if (!track) return;
                let html = '';
                for (let i = 0; i < 35; i++) {
                    const item = localItemsPool[i % localItemsPool.length];
                    html += `
                        <div class="case-item-box">
                            ${renderMedia(item)}
                            <div class="item-name">${item.name}</div>
                        </div>
                    `;
                }
                track.innerHTML = html;
            });
        }

        async function animateRoulette(trackId, winningItem) {
            const track = document.getElementById(trackId);
            if (!track) return;
            
            let html = '';
            const targetIndex = 25; 
            for (let i = 0; i < 35; i++) {
                const item = (i === targetIndex) ? winningItem : localItemsPool[i % localItemsPool.length];
                html += `
                    <div class="case-item-box">
                        ${renderMedia(item)}
                        <div class="item-name">${item.name}</div>
                    </div>
                `;
            }
            track.innerHTML = html;
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';

            setTimeout(() => {
                const itemWidth = 126; 
                const offset = (targetIndex * itemWidth) - 150; 
                track.style.transition = 'transform 4s cubic-bezier(0.1, 0.8, 0.2, 1)';
                track.style.transform = `translateX(-${offset}px)`;
            }, 50);
        }

        async function spinCase() {
            const btn = document.getElementById('spin-case-btn');
            const isDemo = document.getElementById('demo-mode-checkbox').checked;
            btn.disabled = true;

            try {
                const response = await fetch('/api/spin-case', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, case_type: "starter", is_demo: isDemo })
                });
                const data = await response.json();
                if (response.ok) {
                    await animateRoulette('case-track', data.item);
                    setTimeout(async () => {
                        document.getElementById('user-balance').innerText = data.balance;
                        if (!isDemo) {
                            await addToInventory(data.item);
                        }
                        btn.disabled = false;
                    }, 4100);
                } else {
                    alert(data.detail || "Ошибка");
                    btn.disabled = false;
                }
            } catch (e) {
                console.error("Spin error:", e);
                btn.disabled = false;
            }
        }

        async function spinWheel() {
            const btn = document.getElementById('spin-wheel-btn');
            const isDemo = document.getElementById('demo-mode-checkbox').checked;
            btn.disabled = true;

            try {
                const response = await fetch('/api/spin-wheel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, is_demo: isDemo })
                });
                const data = await response.json();
                if (response.ok) {
                    await animateRoulette('wheel-track', data.item);
                    setTimeout(async () => {
                        document.getElementById('user-balance').innerText = data.balance;
                        if (!isDemo) {
                            await addToInventory(data.item);
                        }
                        btn.disabled = false;
                    }, 4100);
                } else {
                    alert(data.detail || "Ошибка");
                    btn.disabled = false;
                }
            } catch (e) {
                console.error("Spin error:", e);
                btn.disabled = false;
            }
        }

        async function addToInventory(item) {
            try {
                const response = await fetch('/api/inventory-action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, action: "claim", item: item })
                });
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('user-balance').innerText = data.balance;
                    updateInventoryUI(data.inventory);
                }
            } catch (e) {
                console.error("Inventory error:", e);
            }
        }

        async function sellItem(uid) {
            try {
                const response = await fetch('/api/sell-inventory-item', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, uid: uid })
                });
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('user-balance').innerText = data.balance;
                    updateInventoryUI(data.inventory);
                }
            } catch (e) {
                console.error("Sell error:", e);
            }
        }

        function updateInventoryUI(inventory) {
            const list = document.getElementById('inventory-list');
            if (!inventory || inventory.length === 0) {
                list.innerHTML = `<p style="color: var(--text-secondary);">Ваш инвентарь пуст</p>`;
                return;
            }
            list.innerHTML = inventory.map(item => `
                <div class="item-card">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        ${item.animation && (item.animation.endsWith('.mp4') || item.animation.includes('mixkit.co')) ? `<video src="${item.animation}" width="36" height="36" autoplay loop muted playsinline style="object-fit:contain; border-radius:4px;"></video>` : `<img src="${item.image || ''}" width="36" height="36" style="object-fit: contain; border-radius:4px;" onerror="this.style.display='none'">`}
                        <div><b>${item.name}</b><br><small style="color: var(--gold);">+${item.price} ⭐</small></div>
                    </div>
                    <button class="btn" style="width: auto; padding: 6px 14px; margin: 0; font-size: 13px;" onclick="sellItem(${item.uid})">Продать</button>
                </div>
            `).join('');
        }

        function switchTab(tabName, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            element.classList.add('active');
        }

        initApp();
    </script>
</body>
</html>
