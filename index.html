<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatRoll - Cases & NFT</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #ffb800;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .balance {
            font-size: 24px;
            margin-bottom: 20px;
            color: #00ffcc;
        }
        button {
            background-color: #ffb800;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #ffa000;
        }
        .roulette {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 120px;
            background: #2a2a2a;
            border-radius: 8px;
            margin: 20px 0;
            overflow: hidden;
            font-size: 48px;
        }
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .inventory-card {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .sell-btn {
            background-color: #ff4444;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
        }
        .withdraw-btn {
            background-color: #44bb44;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CatRoll 🐱</h1>
        <div class="balance">Баланс: <span id="balance-val">0</span> ⭐</div>

        <div>
            <button onclick="openCase('starter')">Открыть кейс (50 ⭐)</button>
            <button onclick="spinWheel()">Колесо удачи (100 ⭐)</button>
            <button onclick="claimBonus()">Бонус (50 ⭐)</button>
        </div>

        <div class="roulette" id="roulette-box">🎁</div>
        <div id="result-text" style="font-size: 18px; margin-bottom: 15px; color: #ffb800;"></div>

        <h3>Инвентарь</h3>
        <div class="inventory-grid" id="inventory-grid"></div>
    </div>

    <script>
        const userId = "user_" + Math.floor(Math.random() * 100000);
        let state = { balance: 0, inventory: [] };

        async function initApp() {
            let res = await fetch('/api/init', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId })
            });
            let data = await res.json();
            state.balance = data.balance;
            state.inventory = data.inventory;
            updateUI();
        }

        function updateUI() {
            document.getElementById('balance-val').innerText = state.balance;
            let grid = document.getElementById('inventory-grid');
            grid.innerHTML = '';
            
            if (state.inventory.length === 0) {
                grid.innerHTML = '<div style="grid-column: span 2; color: #888;">Инвентарь пуст</div>';
                return;
            }

            state.inventory.forEach(item => {
                grid.innerHTML += `
                    <div class="inventory-card">
                        <div style="font-size: 36px;">${item.icon}</div>
                        <div style="font-size: 14px; font-weight: bold;">${item.name}</div>
                        <div style="font-size: 12px; color: #ffb800; margin-bottom: 8px;">${item.price} ⭐</div>
                        <button class="sell-btn" onclick="sellItem(${item.uid})">Продать</button>
                    </div>
                `;
            });
        }

        async function claimBonus() {
            let res = await fetch('/api/bonus', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId })
            });
            if (!res.ok) {
                alert("Бонус пока недоступен (нужно ждать 24 часа)!");
                return;
            }
            let data = await res.json();
            state.balance = data.balance;
            document.getElementById('result-text').innerText = `Получен бонус: ${data.item.name} (+${data.item.price} ⭐)`;
            updateUI();
        }

        async function openCase(caseType) {
            let res = await fetch('/api/spin-case', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, case_type: caseType })
            });
            if (!res.ok) {
                alert("Недостаточно звезд на балансе!");
                return;
            }
            let data = await res.json();
            state.balance = data.balance;
            
            document.getElementById('roulette-box').innerText = data.item.icon;
            document.getElementById('result-text').innerText = `Вы выиграли: ${data.item.name}!`;

            let actionRes = await fetch('/api/inventory-action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, action: 'claim', item: data.item })
            });
            let actionData = await actionRes.json();
            state.inventory = actionData.inventory;
            updateUI();
        }

        async function spinWheel() {
            let res = await fetch('/api/spin-wheel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId })
            });
            if (!res.ok) {
                alert("Недостаточно звезд!");
                return;
            }
            let data = await res.json();
            state.balance = data.balance;
            
            document.getElementById('roulette-box').innerText = data.item.icon;
            document.getElementById('result-text').innerText = `Колесо принесло: ${data.item.name}!`;

            let actionRes = await fetch('/api/inventory-action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, action: 'claim', item: data.item })
            });
            let actionData = await actionRes.json();
            state.inventory = actionData.inventory;
            updateUI();
        }

        async function sellItem(uid) {
            let res = await fetch('/api/sell-inventory-item', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, uid: uid })
            });
            let data = await res.json();
            state.balance = data.balance;
            state.inventory = data.inventory;
            updateUI();
        }

        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
