<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CatRoll — NFT & Gifts</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0d;
            --card-bg: #16161a;
            --accent-color: #ffffff;
            --border-color: #26262e;
            --text-secondary: #8a8a9e;
            --gold: #f39c12;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }

        /* Шапка с балансом */
        .header {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
        }

        .balance-pill {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Выбор кейсов */
        .cases-selector {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .case-tab {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .case-tab.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* Рулетка */
        .case-container {
            width: 100%;
            max-width: 360px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 16px;
        }

        .roulette-wrapper {
            position: relative;
            width: 100%;
            height: 110px;
            overflow: hidden;
            border-radius: 16px;
            background: #0d0d10;
            border: 1px solid var(--border-color);
        }

        .pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 100%;
            background: #ff3b30;
            z-index: 10;
        }

        .roulette-track {
            display: flex;
            align-items: center;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            transition: transform 5s cubic-bezier(0.1, 1, 0.1, 1);
        }

        .item-card {
            min-width: 85px;
            height: 85px;
            margin: 0 5px;
            background: #1c1c22;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
        }

        .item-card .icon { font-size: 28px; }
        .item-card .name { font-size: 10px; color: var(--text-secondary); margin-top: 4px; font-weight: 600; }

        /* Кнопки меню */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 20px;
        }

        .menu-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .menu-btn:active { background: #22222a; }
        .menu-btn span { display: block; font-size: 18px; margin-bottom: 4px; }

        /* Нижняя панель */
        .actions {
            width: 100%;
            max-width: 360px;
            position: fixed;
            bottom: 16px;
            padding: 0 16px;
        }

        .spin-btn {
            width: 100%;
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
        }

        .spin-btn:active { transform: scale(0.98); }
        .spin-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- Шапка с новым балансом -->
    <div class="header">
        <div class="logo">🐱 CatRoll</div>
        <div class="balance-pill" id="balanceBlock">
            ⭐ <span id="balance">200000</span>
        </div>
    </div>

    <!-- Выбор кейсов -->
    <div class="cases-selector">
        <div class="case-tab active" onclick="switchCase('standard', 50)">Standard (50⭐)</div>
        <div class="case-tab" onclick="switchCase('epic', 150)">Epic (150⭐)</div>
        <div class="case-tab" onclick="switchCase('legendary', 500)">Legendary (500⭐)</div>
    </div>

    <!-- Рулетка -->
    <div class="case-container">
        <div class="roulette-wrapper">
            <div class="pointer"></div>
            <div class="roulette-track" id="track"></div>
        </div>
    </div>

    <!-- Дополнительные кнопки -->
    <div class="menu-grid">
        <div class="menu-btn" onclick="openModal('inventory')">
            <span>🎒</span>Inventory
        </div>
        <div class="menu-btn" onclick="openModal('deposit')">
            <span>💳</span>Top Up
        </div>
        <div class="menu-btn" onclick="openModal('refs')">
            <span>👥</span>Friends
        </div>
    </div>

    <!-- Кнопка крутки -->
    <div class="actions">
        <button class="spin-btn" id="spinBtn" onclick="startSpin()">Spin Case (50 ⭐)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentPrice = 50;
        let userBalance = 200000; // Баланс 200,000 звезд

        // Список предметов с повешенными шансами (weight) для NFT
        const items = [
            { icon: '💎', name: 'Star NFT', weight: 30 },  /* Повышенный шанс (+1.5%) */
            { icon: '👑', name: 'Crown NFT', weight: 25 },
            { icon: '🏆', name: 'Trophy', weight: 40 },
            { icon: '🎁', name: 'Gift Box', weight: 80 },
            { icon: '⚡', name: 'Energy', weight: 100 }
        ];

        const track = document.getElementById('track');
        const spinBtn = document.getElementById('spinBtn');
        const balanceEl = document.getElementById('balance');

        function getRandomItem() {
            const totalWeight = items.reduce((acc, item) => acc + item.weight, 0);
            let random = Math.random() * totalWeight;
            for (let item of items) {
                if (random < item.weight) return item;
                random -= item.weight;
            }
            return items[0];
        }

        function initTrack() {
            track.innerHTML = '';
            for (let i = 0; i < 40; i++) {
                const randomItem = getRandomItem();
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="icon">${randomItem.icon}</div>
                    <div class="name">${randomItem.name}</div>
                `;
                track.appendChild(card);
            }
        }

        function switchCase(type, price) {
            currentPrice = price;
            spinBtn.innerText = `Spin Case (${price} ⭐)`;
            
            document.querySelectorAll('.case-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            initTrack();
        }

        function openModal(type) {
            if (type === 'inventory') {
                tg.showAlert("Your inventory is empty. Win items in cases!");
            } else if (type === 'deposit') {
                tg.showAlert("Opening Telegram Stars invoice...");
            } else if (type === 'refs') {
                tg.showAlert("Invite friends and earn 10% from their spins!");
            }
        }

        function startSpin() {
            if (userBalance < currentPrice) {
                tg.showAlert("Not enough Telegram Stars on balance!");
                return;
            }

            spinBtn.disabled = true;
            userBalance -= currentPrice;
            balanceEl.innerText = userBalance;
            
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
            
            setTimeout(() => {
                const itemWidth = 95;
                const winnerIndex = 28;
                const offset = -(winnerIndex * itemWidth - (track.parentElement.clientWidth / 2) + (itemWidth / 2));
                
                track.style.transition = 'transform 5s cubic-bezier(0.1, 1, 0.1, 1)';
                track.style.transform = `translateX(${offset}px)`;

                setTimeout(() => {
                    spinBtn.disabled = false;
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

                    tg.sendData(JSON.stringify({
                        action: "spin",
                        price: currentPrice
                    }));
                }, 5200);
            }, 50);
        }

        initTrack();
    </script>
</body>
</html>
