<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CatRoll — NFT & Gifts</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0d;
            --card-bg: #16161a;
            --accent-color: #ffffff;
            --border-color: #26262e;
            --text-secondary: #8a8a9e;
            --gold: #f39c12;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }

        /* Шапка */
        .header {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
        }

        .balance-pill {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .screen {
            width: 100%;
            max-width: 360px;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        /* Главное меню выбора */
        .menu-title {
            font-size: 22px;
            font-weight: 800;
            margin: 10px 0 6px 0;
            text-align: center;
        }

        .menu-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            text-align: center;
        }

        .mode-card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 14px;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.2s;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .mode-card:active {
            transform: scale(0.98);
            border-color: #ffffff;
        }

        .mode-icon {
            font-size: 36px;
            background: #111115;
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
        }

        .mode-info h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .mode-info p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Кнопка "Назад" */
        .back-btn {
            align-self: flex-start;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Рулетка 1: Горизонтальная */
        .case-container {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 16px;
        }

        .roulette-wrapper {
            position: relative;
            width: 100%;
            height: 110px;
            overflow: hidden;
            border-radius: 16px;
            background: #0d0d10;
            border: 1px solid var(--border-color);
        }

        .pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 100%;
            background: #ff3b30;
            z-index: 10;
        }

        .roulette-track {
            display: flex;
            align-items: center;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            transition: transform 5s cubic-bezier(0.1, 1, 0.1, 1);
        }

        .item-card {
            min-width: 85px;
            height: 85px;
            margin: 0 5px;
            background: #1c1c22;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
        }

        .item-card .icon { font-size: 28px; }
        .item-card .name { font-size: 10px; color: var(--text-secondary); margin-top: 4px; font-weight: 600; }

        /* Рулетка 2: Колесо Фортуны */
        .wheel-box {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 10px 0 20px 0;
        }

        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 20px solid #ff3b30;
            z-index: 20;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--border-color);
            position: relative;
            overflow: hidden;
            transition: transform 5s cubic-bezier(0.1, 1, 0.1, 1);
            background: conic-gradient(
                #1e1e24 0deg 72deg,
                #2a2a34 72deg 144deg,
                #1e1e24 144deg 216deg,
                #2a2a34 216deg 288deg,
                #1e1e24 288deg 360deg
            );
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }

        .wheel-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
            font-size: 22px;
            font-weight: bold;
        }

        .wheel-label:nth-child(1) { transform: rotate(36deg) translate(60px, -15px); }
        .wheel-label:nth-child(2) { transform: rotate(108deg) translate(60px, -15px); }
        .wheel-label:nth-child(3) { transform: rotate(180deg) translate(60px, -15px); }
        .wheel-label:nth-child(4) { transform: rotate(252deg) translate(60px, -15px); }
        .wheel-label:nth-child(5) { transform: rotate(324deg) translate(60px, -15px); }

        /* Вкладки кейсов */
        .cases-selector {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-bottom: 16px;
            overflow-x: auto;
        }

        .case-tab {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .case-tab.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* Нижние действия */
        .actions {
            width: 100%;
            max-width: 360px;
            position: fixed;
            bottom: 16px;
            padding: 0 16px;
        }

        .spin-btn {
            width: 100%;
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
        }

        .spin-btn:active { transform: scale(0.98); }
        .spin-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- Шапка с балансом -->
    <div class="header">
        <div class="logo" onclick="showScreen('menuScreen')">🐱 CatRoll</div>
        <div class="balance-pill">
            ⭐ <span id="balance">200000</span>
        </div>
    </div>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ ВЫБОРА РУЛЕТОК -->
    <div class="screen active" id="menuScreen">
        <div class="menu-title">Select Game Mode</div>
        <div class="menu-subtitle">Choose your preferred roulette style to roll gifts</div>

        <div class="mode-card" onclick="openGameMode('classic')">
            <div class="mode-icon">🎰</div>
            <div class="mode-info">
                <h3>Classic Roller</h3>
                <p>Horizontal card spinner case</p>
            </div>
        </div>

        <div class="mode-card" onclick="openGameMode('wheel')">
            <div class="mode-icon">🎡</div>
            <div class="mode-info">
                <h3>Wheel of Fortune</h3>
                <p>Spin the circular prize wheel</p>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: РУЛЕТКА 1 (ГОРИЗОНТАЛЬНАЯ) -->
    <div class="screen" id="classicScreen">
        <button class="back-btn" onclick="showScreen('menuScreen')">← Back to Modes</button>

        <div class="cases-selector">
            <div class="case-tab active" onclick="switchCase('standard', 50)">Standard (50⭐)</div>
            <div class="case-tab" onclick="switchCase('epic', 150)">Epic (150⭐)</div>
        </div>

        <div class="case-container">
            <div class="roulette-wrapper">
                <div class="pointer"></div>
                <div class="roulette-track" id="track"></div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 3: РУЛЕТКА 2 (КОЛЕСО ФОРТУНЫ) -->
    <div class="screen" id="wheelScreen">
        <button class="back-btn" onclick="showScreen('menuScreen')">← Back to Modes</button>

        <div class="wheel-box">
            <div class="wheel-pointer"></div>
            <div class="wheel" id="wheelTrack">
                <div class="wheel-label">💎</div>
                <div class="wheel-label">👑</div>
                <div class="wheel-label">🏆</div>
                <div class="wheel-label">🎁</div>
                <div class="wheel-label">⚡</div>
            </div>
        </div>
    </div>

    <!-- КНОПКА КРУТКИ -->
    <div class="actions" id="actionBox" style="display: none;">
        <button class="spin-btn" id="spinBtn" onclick="triggerSpin()">Spin Roll (50 ⭐)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentPrice = 50;
        let userBalance = 200000;
        let activeMode = null;
        let currentRotation = 0;

        const items = [
            { icon: '💎', name: 'Star NFT', weight: 30 },
            { icon: '👑', name: 'Crown NFT', weight: 25 },
            { icon: '🏆', name: 'Trophy', weight: 40 },
            { icon: '🎁', name: 'Gift Box', weight: 80 },
            { icon: '⚡', name: 'Energy', weight: 100 }
        ];

        const track = document.getElementById('track');
        const wheelTrack = document.getElementById('wheelTrack');
        const spinBtn = document.getElementById('spinBtn');
        const balanceEl = document.getElementById('balance');
        const actionBox = document.getElementById('actionBox');

        function getRandomItem() {
            const totalWeight = items.reduce((acc, item) => acc + item.weight, 0);
            let random = Math.random() * totalWeight;
            for (let item of items) {
                if (random < item.weight) return item;
                random -= item.weight;
            }
            return items[0];
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            if (screenId === 'menuScreen') {
                actionBox.style.display = 'none';
            } else {
                actionBox.style.display = 'block';
            }
        }

        function openGameMode(mode) {
            activeMode = mode;
            if (mode === 'classic') {
                initClassicTrack();
                showScreen('classicScreen');
            } else if (mode === 'wheel') {
                showScreen('wheelScreen');
            }
        }

        function initClassicTrack() {
            track.innerHTML = '';
            for (let i = 0; i < 40; i++) {
                const randomItem = getRandomItem();
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="icon">${randomItem.icon}</div>
                    <div class="name">${randomItem.name}</div>
                `;
                track.appendChild(card);
            }
        }

        function switchCase(type, price) {
            currentPrice = price;
            spinBtn.innerText = `Spin Roll (${price} ⭐)`;
            initClassicTrack();
        }

        function triggerSpin() {
            if (userBalance < currentPrice) {
                tg.showAlert("Not enough Telegram Stars on balance!");
                return;
            }

            spinBtn.disabled = true;
            userBalance -= currentPrice;
            balanceEl.innerText = userBalance;

            if (activeMode === 'classic') {
                spinClassic();
            } else if (activeMode === 'wheel') {
                spinWheel();
            }
        }

        function spinClassic() {
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
            
            setTimeout(() => {
                const itemWidth = 95;
                const winnerIndex = 28;
                const offset = -(winnerIndex * itemWidth - (track.parentElement.clientWidth / 2) + (itemWidth / 2));
                
                track.style.transition = 'transform 5s cubic-bezier(0.1, 1, 0.1, 1)';
                track.style.transform = `translateX(${offset}px)`;

                setTimeout(() => {
                    spinBtn.disabled = false;
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    tg.sendData(JSON.stringify({ action: "spin_classic", price: currentPrice }));
                }, 5200);
            }, 50);
        }

        function spinWheel() {
            const extraDegrees = Math.floor(Math.random() * 360) + 1800; // Мин 5 полных оборотов
            currentRotation += extraDegrees;
            
            wheelTrack.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                spinBtn.disabled = false;
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                tg.sendData(JSON.stringify({ action: "spin_wheel", price: currentPrice }));
            }, 5200);
        }
    </script>
</body>
</html>
