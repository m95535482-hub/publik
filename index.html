<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatRoll - Case Opening</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0b0f19);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #64748b);
            --button-color: var(--tg-theme-button-color, #6366f1);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: rgba(30, 41, 59, 0.6);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 90px;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .header p {
            margin: 4px 0 0;
            color: var(--hint-color);
            font-size: 13px;
        }

        .tabs {
            display: flex;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 4px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--hint-color);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab.active {
            background: var(--button-color);
            color: var(--button-text);
        }

        .section-content {
            display: none;
            width: 100%;
            max-width: 400px;
        }

        .section-content.active {
            display: block;
        }

        /* Roulette section */
        .case-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .roulette-window {
            height: 100px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            margin: 16px 0;
            border: 2px solid var(--button-color);
            overflow: hidden;
            position: relative;
        }

        .btn {
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* Inventory */
        .inventory-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .item-info h4 {
            margin: 0 0 4px 0;
            font-size: 15px;
        }

        .item-info span {
            font-size: 12px;
            color: var(--hint-color);
        }

        .withdraw-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }

        .withdraw-btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🐱 CatRoll Cases</h1>
        <p id="user-greeting">Loading profile...</p>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('roll', this)">Roulette</div>
        <div class="tab" onclick="switchTab('inventory', this)">Inventory</div>
    </div>

    <!-- Roulette Tab -->
    <div id="roll-section" class="section-content active">
        <div class="case-card">
            <h3>Lucky Case</h3>
            <p style="color: var(--hint-color); font-size: 13px;">Try your luck and win exclusive items!</p>
            <div class="roulette-window" id="roulette-display">
                Ready to spin
            </div>
            <button class="btn" onclick="spinCase()">🎲 Spin Case (Free Test)</button>
        </div>
    </div>

    <!-- Inventory Tab -->
    <div id="inventory-section" class="section-content">
        <div id="inventory-list" class="inventory-list">
            <p style="text-align: center; color: var(--hint-color);">Loading inventory...</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe?.user?.id || 1218168630;
        const userName = tg.initDataUnsafe?.user?.first_name || "Player";
        document.getElementById('user-greeting').innerText = `Welcome back, ${userName}!`;

        function switchTab(tabName, element) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));

            element.classList.add('active');
            document.getElementById(`${tabName}-section`).classList.add('active');

            if (tabName === 'inventory') {
                loadInventory();
            }
        }

        async function spinCase() {
            const display = document.getElementById('roulette-display');
            display.innerText = "Rolling...";

            try {
                const response = await fetch(`/api/roll/${userId}`, { method: 'POST' });
                const data = await response.json();
                
                setTimeout(() => {
                    display.innerText = `🎉 Won: ${data.gift_name}`;
                }, 500);
            } catch (e) {
                display.innerText = "Error!";
            }
        }

        async function loadInventory() {
            try {
                const response = await fetch(`/api/inventory/${userId}`);
                const items = await response.json();
                
                const container = document.getElementById('inventory-list');
                container.innerHTML = '';

                if (items.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--hint-color);">Your inventory is empty. Spin the case!</p>';
                    return;
                }

                items.forEach(item => {
                    let statusText = 'In inventory';
                    let btnDisabled = '';
                    let btnText = 'Withdraw';

                    if (item.status === 'withdraw_requested') {
                        statusText = '⏳ Withdrawal pending';
                        btnDisabled = 'disabled';
                        btnText = 'Requested';
                    }

                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.innerHTML = `
                        <div class="item-info">
                            <h4>${item.gift_name}</h4>
                            <span>${statusText}</span>
                        </div>
                        <button class="withdraw-btn" ${btnDisabled} onclick="withdrawItem(${item.id}, this)">${btnText}</button>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error("Failed to load inventory", e);
            }
        }

        async function withdrawItem(itemId, btn) {
            if (!confirm("Do you want to request a withdrawal for this item?")) return;

            btn.disabled = true;
            btn.innerText = "Sending...";

            try {
                const res = await fetch(`/api/withdraw/${itemId}`, { method: 'POST' });
                const data = await res.json();
                alert(data.message || "Success!");
                loadInventory();
            } catch (e) {
                alert("Connection error.");
                btn.disabled = false;
                btn.innerText = "Withdraw";
            }
        }
    </script>
</body>
</html>
