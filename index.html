<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatRoll - Cases & Gifts</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #94a3b8);
            --button-color: var(--tg-theme-button-color, #3b82f6);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 80px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
        }

        .header p {
            margin: 0;
            color: var(--hint-color);
            font-size: 14px;
        }

        .tabs {
            display: flex;
            background: var(--card-bg);
            border-radius: 14px;
            padding: 4px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--hint-color);
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab.active {
            background: var(--button-color);
            color: var(--button-text);
        }

        .section-content {
            display: none;
            width: 100%;
            max-width: 400px;
        }

        .section-content.active {
            display: block;
        }

        .roulette-container {
            text-align: center;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .roulette-box {
            height: 120px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
            border: 2px dashed var(--button-color);
            overflow: hidden;
            position: relative;
        }

        .btn {
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .inventory-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 10px;
        }

        .item-details h4 {
            margin: 0 0 4px 0;
            font-size: 15px;
        }

        .item-details span {
            font-size: 12px;
            color: var(--hint-color);
        }

        .withdraw-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }

        .withdraw-btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎁 CatRoll</h1>
        <p id="user-greeting">Loading profile...</p>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('roll', this)">Roulette</div>
        <div class="tab" onclick="switchTab('inventory', this)">Inventory</div>
    </div>

    <div id="roll-section" class="section-content active">
        <div class="roulette-container">
            <h3>Case Opening</h3>
            <div class="roulette-box" id="roulette-display">
                Click the button below!
            </div>
            <button class="btn" onclick="spinRoulette()">🎲 Get Gift (/buy)</button>
        </div>
    </div>

    <div id="inventory-section" class="section-content">
        <div id="inventory-list">
            <p style="text-align: center; color: var(--hint-color);">Loading inventory...</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe?.user?.id || 1218168630;
        const userName = tg.initDataUnsafe?.user?.first_name || "Player";
        document.getElementById('user-greeting').innerText = `Welcome, ${userName}!`;

        function switchTab(tabName, element) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));

            element.classList.add('active');
            document.getElementById(`${tabName}-section`).classList.add('active');

            if (tabName === 'inventory') {
                loadInventory();
            }
        }

        async function spinRoulette() {
            const display = document.getElementById('roulette-display');
            display.innerText = "Rolling...";
            
            setTimeout(() => {
                display.innerText = "🎉 Check your chat with the bot!";
                alert("To get a gift, send the /buy command in the chat with the bot or refresh your inventory.");
                loadInventory();
            }, 1000);
        }

        async function loadInventory() {
            try {
                const response = await fetch(`/api/inventory/${userId}`);
                const items = await response.json();
                
                const container = document.getElementById('inventory-list');
                container.innerHTML = '';

                if (items.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--hint-color);">Your inventory is currently empty.</p>';
                    return;
                }

                items.forEach(item => {
                    let statusText = 'In inventory';
                    let btnDisabled = '';
                    let btnText = 'Withdraw';

                    if (item.status === 'withdraw_requested') {
                        statusText = '⏳ Withdrawal pending';
                        btnDisabled = 'disabled';
                        btnText = 'Pending';
                    }

                    const div = document.createElement('div');
                    div.className = 'inventory-item';
                    div.innerHTML = `
                        <div class="item-details">
                            <h4>${item.gift_name}</h4>
                            <span>${statusText}</span>
                        </div>
                        <button class="withdraw-btn" ${btnDisabled} onclick="withdrawItem(${item.id}, this)">${btnText}</button>
                    `;
                    container.appendChild(div);
                });
            } catch (e) {
                console.error("Error loading inventory", e);
            }
        }

        async function withdrawItem(itemId, btn) {
            if (!confirm("Do you want to request a withdrawal for this gift?")) return;

            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const res = await fetch(`/api/withdraw/${itemId}`, { method: 'POST' });
                const data = await res.json();
                alert(data.message || "Success!");
                loadInventory();
            } catch (e) {
                alert("Connection error.");
                btn.disabled = false;
                btn.innerText = "Withdraw";
            }
        }
    </script>
</body>
</html>
